<script>

const STORAGE_KEY="anki_like_qa_v2";

let state={
  decks:{},
  activeDeckId:null,
  backgroundImage:null
};

let quizOrder=[],
    currentIndex=0,
    wrongQuestions=[],
    quizMode="all",
    typingTimer=null,
    autoAnswerTimer=null;

let questionText="",
    questionPosition=0;


/* =========================
   基本
========================= */

function uid(){
  return "d_"+Date.now()+"_"+Math.random().toString(36).slice(2,9)
}

function loadState(){

  try{

    const x=JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

    if(x&&x.decks){
      state=x;
    }

  }catch(e){}

  if(!state.decks){
    state.decks={}
  }

  if(!("backgroundImage" in state)){
    state.backgroundImage=null
  }

  Object.values(state.decks).forEach(d=>{

    if(!Array.isArray(d.questions)){
      d.questions=[]
    }

    if(!Array.isArray(d.reviewQuestions)){
      d.reviewQuestions=[]
    }

    if(!("progress" in d)){
      d.progress=null
    }

  });

}

function persist(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  )
}

function deck(){
  return state.decks[state.activeDeckId]
}

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");
}


/* =========================
   メインタブ
========================= */

function showMainTab(tab){

  document.getElementById("decksTab").style.display=
    tab==="decks"?"block":"none";

  document.getElementById("searchTab").style.display=
    tab==="search"?"block":"none";

  document.getElementById("tabDeck").classList.toggle(
    "active",
    tab==="decks"
  );

  document.getElementById("tabSearch").classList.toggle(
    "active",
    tab==="search"
  );

  if(tab==="decks"){
    renderDecks();
  }else{
    renderSearch();
  }

}


/* =========================
   デッキ
========================= */

function createDeck(){

  const name=prompt("デッキ名を入力してください");

  if(!name||!name.trim())return;

  const id=uid();

  state.decks[id]={
    id,
    name:name.trim(),
    questions:[],
    reviewQuestions:[],
    progress:null
  };

  state.activeDeckId=id;

  persist();

  openEditor(id);
}

function renderDecks(){

  const el=document.getElementById("deckList");

  const ids=Object.keys(state.decks);

  if(!ids.length){

    el.innerHTML=
      '<div class="empty">デッキがありません。<br>「＋ デッキを作成」から作成してください。</div>';

    return;
  }

  el.innerHTML=ids.map(id=>{

    const d=state.decks[id];

    const p=d.progress;

    const total=
      p&&p.quizOrder
      ?p.quizOrder.length
      :d.questions.length;

    const pos=
      p&&p.quizOrder
      ?Math.min(p.currentIndex,total)
      :0;

    return `
      <div class="deck-card">

        <h3>${esc(d.name)}</h3>

        <div class="muted">
          全問題：${d.questions.length}問
        </div>

        <div class="muted">
          復習：${d.reviewQuestions.length}問
        </div>

        <div class="muted">
          保存された進捗：${pos} / ${total}
        </div>

        <div
          class="actions"
          style="justify-content:flex-start">

          <button
            class="primary"
            onclick="openEditor('${id}')">
            編集
          </button>

          ${
            d.questions.length
            ?
            `<button
              class="green"
              onclick="startQuiz('${id}','all')">
              全問題
            </button>`
            :""
          }

          ${
            d.reviewQuestions.length
            ?
            `<button
              class="green"
              onclick="startQuiz('${id}','review')">
              復習
            </button>`
            :""
          }

          <button
            class="light"
            onclick="renameDeck('${id}')">
            名前変更
          </button>

          <button
            class="red"
            onclick="deleteDeck('${id}')">
            削除
          </button>

        </div>

      </div>
    `;

  }).join("");

}

function renameDeck(id){

  const d=state.decks[id];

  const n=prompt("デッキ名",d.name);

  if(n&&n.trim()){

    d.name=n.trim();

    persist();

    renderDecks();

  }

}

function deleteDeck(id){

  if(!confirm(
    "このデッキと保存した進捗を削除しますか？"
  ))return;

  delete state.decks[id];

  if(state.activeDeckId===id){
    state.activeDeckId=null;
  }

  persist();

  renderDecks();

}


/* =========================
   編集画面
========================= */

function openEditor(id){

  state.activeDeckId=id;

  persist();

  showScreen("deckEditorScreen");

  document.getElementById("editorTitle").textContent=
    deck().name;

  renderAllTable();

  renderReviewTable();

  showDeckTab("all");

}

function showDeckTab(tab){

  document.getElementById("allQuestionsPanel").style.display=
    tab==="all"?"block":"none";

  document.getElementById("reviewQuestionsPanel").style.display=
    tab==="review"?"block":"none";

  document.getElementById("allTabButton").classList.toggle(
    "active",
    tab==="all"
  );

  document.getElementById("reviewTabButton").classList.toggle(
    "active",
    tab==="review"
  );

}


/* =========================
   全問題デッキ
========================= */

function makeAllEditableRow(q,checked=false){

  const tr=document.createElement("tr");

  /* チェックボックスは全問題デッキだけ */

  const selectTd=document.createElement("td");

  const cb=document.createElement("input");

  cb.type="checkbox";

  cb.dataset.number=q.number||"";

  cb.checked=checked;

  selectTd.appendChild(cb);

  tr.appendChild(selectTd);


  [q.number,q.question,q.answer].forEach(v=>{

    const td=document.createElement("td");

    td.contentEditable="true";

    td.textContent=v||"";

    tr.appendChild(td);

  });

  return tr;

}

function renderAllTable(){

  const tb=document.getElementById("allTableBody");

  tb.innerHTML="";

  const qs=deck().questions;

  if(qs.length){

    qs.forEach(q=>{
      tb.appendChild(
        makeAllEditableRow(q,false)
      );
    });

  }else{

    tb.appendChild(
      makeAllEditableRow({
        number:"",
        question:"",
        answer:""
      })
    );

  }

}

function addAllRow(){

  document
    .getElementById("allTableBody")
    .appendChild(
      makeAllEditableRow({
        number:"",
        question:"",
        answer:""
      })
    );

}

function clearAllTable(){

  if(!confirm(
    "全問題デッキの入力内容をすべて消しますか？"
  ))return;

  document.getElementById(
    "allTableBody"
  ).innerHTML="";

  addAllRow();

}

function readAllTable(){

  return [
    ...document.querySelectorAll(
      "#allTableBody tr"
    )
  ]
  .map(tr=>{

    const cells=[
      ...tr.querySelectorAll("td")
    ];

    return {
      number:cells[1]?.innerText.trim()||"",
      question:cells[2]?.innerText.trim()||"",
      answer:cells[3]?.innerText.trim()||""
    };

  })
  .filter(q=>
    q.number&&
    q.question&&
    q.answer
  );

}


/* =========================
   全問題デッキへのコピペ
========================= */

document
  .getElementById("allTableBody")
  .addEventListener("paste",e=>{

    const text=
      (e.clipboardData||window.clipboardData)
      .getData("text");

    if(
      !text.includes("\t") &&
      !text.includes("\n")
    )return;

    e.preventDefault();

    const rows=
      text
      .replace(/\r/g,"")
      .split("\n")
      .filter(x=>x.trim());

    const tb=
      document.getElementById("allTableBody");

    tb.innerHTML="";

    rows.forEach(r=>{

      const c=r.split("\t");

      tb.appendChild(
        makeAllEditableRow({
          number:c[0]||"",
          question:c[1]||"",
          answer:c[2]||""
        })
      );

    });

  });


/* =========================
   復習デッキ
========================= */

function makeReviewEditableRow(q){

  const tr=document.createElement("tr");

  [q.number,q.question,q.answer].forEach(v=>{

    const td=document.createElement("td");

    td.contentEditable="true";

    td.textContent=v||"";

    tr.appendChild(td);

  });


  const actionTd=document.createElement("td");

  const deleteButton=document.createElement("button");

  deleteButton.className="red";

  deleteButton.textContent="削除";

  deleteButton.onclick=()=>{

    tr.remove();

  };

  actionTd.appendChild(deleteButton);

  tr.appendChild(actionTd);

  return tr;

}

function renderReviewTable(){

  const d=deck();

  const tb=
    document.getElementById("reviewTableBody");

  tb.innerHTML="";

  if(!d.reviewQuestions.length){

    tb.innerHTML=
      '<tr><td colspan="4" class="empty">復習デッキに問題がありません。</td></tr>';

    return;

  }

  d.reviewQuestions.forEach(q=>{

    tb.appendChild(
      makeReviewEditableRow(q)
    );

  });

}

function addReviewRow(){

  const tb=
    document.getElementById("reviewTableBody");

  /* 空状態のメッセージを消す */

  if(
    tb.children.length===1 &&
    tb.querySelector(".empty")
  ){
    tb.innerHTML="";
  }

  tb.appendChild(
    makeReviewEditableRow({
      number:"",
      question:"",
      answer:""
    })
  );

}

function clearReviewTable(){

  if(!confirm(
    "復習デッキの入力内容をすべて消しますか？"
  ))return;

  const tb=
    document.getElementById("reviewTableBody");

  tb.innerHTML="";

  addReviewRow();

}


/* =========================
   復習デッキ読み込み
========================= */

function readReviewTable(){

  return [
    ...document.querySelectorAll(
      "#reviewTableBody tr"
    )
  ]
  .map(tr=>{

    const cells=[
      ...tr.querySelectorAll("td")
    ];

    return {
      number:cells[0]?.innerText.trim()||"",
      question:cells[1]?.innerText.trim()||"",
      answer:cells[2]?.innerText.trim()||""
    };

  })
  .filter(q=>
    q.number&&
    q.question&&
    q.answer
  );

}


/* =========================
   復習デッキへのコピペ
========================= */

document
  .getElementById("reviewTableBody")
  .addEventListener("paste",e=>{

    const text=
      (e.clipboardData||window.clipboardData)
      .getData("text");

    if(
      !text.includes("\t") &&
      !text.includes("\n")
    )return;

    e.preventDefault();

    const rows=
      text
      .replace(/\r/g,"")
      .split("\n")
      .filter(x=>x.trim());

    const tb=
      document.getElementById("reviewTableBody");

    tb.innerHTML="";

    rows.forEach(r=>{

      const c=r.split("\t");

      tb.appendChild(
        makeReviewEditableRow({
          number:c[0]||"",
          question:c[1]||"",
          answer:c[2]||""
        })
      );

    });

  });


/* =========================
   全問題保存
========================= */

function reconcileProgress(d){

  if(
    !d.progress||
    !Array.isArray(d.progress.quizOrder)
  )return;

  const byNumber=
    new Map(
      d.questions.map(
        q=>[String(q.number),q]
      )
    );

  d.progress.quizOrder=
    d.progress.quizOrder
    .map(old=>{

      const fresh=
        byNumber.get(
          String(old.number)
        );

      return fresh
        ?{...fresh}
        :{...old};

    })
    .filter(q=>
      byNumber.has(
        String(q.number)
      )
    );

  d.progress.currentIndex=
    Math.min(
      d.progress.currentIndex||0,
      d.progress.quizOrder.length
    );

  d.progress.wrongQuestions=
    (d.progress.wrongQuestions||[])
    .filter(n=>
      byNumber.has(String(n))
    );

  if(
    !d.progress.quizOrder.length||
    d.progress.currentIndex>=
      d.progress.quizOrder.length
  ){
    d.progress=null;
  }

}

function saveDeck(){

  const d=deck();

  if(!d)return;

  const oldReview=
    d.reviewQuestions||[];

  d.questions=readAllTable();


  /* 全問題デッキの番号を基準に、
     復習デッキの問題文・答えを更新 */

  const valid=
    new Map(
      d.questions.map(
        q=>[String(q.number),q]
      )
    );

  d.reviewQuestions=
    oldReview
    .map(q=>
      valid.get(String(q.number))
    )
    .filter(Boolean);


  reconcileProgress(d);

  persist();

  renderAllTable();

  renderReviewTable();

  alert(
    "全問題デッキを保存しました。"
  );

}


/* =========================
   復習デッキ保存
========================= */

function saveReviewDeck(){

  const d=deck();

  if(!d)return;

  const allMap=
    new Map(
      d.questions.map(
        q=>[String(q.number),q]
      )
    );

  const review=
    readReviewTable();

  /*
    復習デッキに直接入力・貼り付けした問題は
    全問題デッキにも存在する場合、最新内容を使用。
    存在しない問題も復習デッキには登録可能。
  */

  d.reviewQuestions=
    review.map(q=>{

      const all=
        allMap.get(
          String(q.number)
        );

      return all
        ?{...all}
        :{...q};

    });

  persist();

  renderReviewTable();

  renderDecks();

  alert(
    "復習デッキを保存しました。"
  );

}


/* =========================
   全問題 → 復習デッキ
========================= */

function addSelectedToReview(){

  const d=deck();

  if(!d)return;

  const selected=[
    ...document.querySelectorAll(
      "#allTableBody input[type=checkbox]:checked"
    )
  ]
  .map(x=>String(x.dataset.number));


  if(!selected.length){

    alert(
      "復習デッキに追加する問題を選択してください。"
    );

    return;

  }


  /*
    保存前の編集内容も反映するため、
    現在の全問題テーブルを読み取る
  */

  const currentAll=
    readAllTable();

  const map=
    new Map(
      currentAll.map(
        q=>[String(q.number),q]
      )
    );

  const currentReview=
    new Map(
      d.reviewQuestions.map(
        q=>[String(q.number),q]
      )
    );


  selected.forEach(n=>{

    if(map.has(n)){
      currentReview.set(
        n,
        map.get(n)
      );
    }

  });


  d.questions=currentAll;

  d.reviewQuestions=[
    ...currentReview.values()
  ];

  reconcileProgress(d);

  persist();

  renderAllTable();

  renderReviewTable();

  renderDecks();

  alert(
    "選択した問題を復習デッキに追加しました。"
  );

}


/* =========================
   クイズ開始
========================= */

function startQuizFromEditor(mode){

  if(mode==="all"){

    saveDeck();

  }else{

    saveReviewDeck();

  }

  const d=deck();

  const source=
    mode==="review"
    ?d.reviewQuestions
    :d.questions;

  if(source.length){

    startQuiz(
      d.id,
      mode
    );

  }

}

function startQuiz(
  id,
  mode="all",
  resume=true
){

  const d=state.decks[id];

  const source=
    mode==="review"
    ?d.reviewQuestions
    :d.questions;

  if(!d||!source.length){

    alert("問題がありません。");

    return;

  }

  state.activeDeckId=id;

  quizMode=mode;

  let p=d.progress;

  const validNumbers=
    new Set(
      source.map(
        q=>String(q.number)
      )
    );


  if(
    resume&&
    p&&
    p.mode===mode&&
    Array.isArray(p.quizOrder)&&
    p.quizOrder.length&&
    p.quizOrder.every(
      q=>
        validNumbers.has(
          String(q.number)
        )
    )&&
    p.currentIndex<
      p.quizOrder.length
  ){

    quizOrder=
      p.quizOrder.map(q=>{

        const fresh=
          source.find(
            x=>
              String(x.number)===
              String(q.number)
          );

        return fresh
          ?{...fresh,...q}
          :{...q};

      });

    currentIndex=p.currentIndex;

    wrongQuestions=
      p.wrongQuestions||[];

  }else{

    quizOrder=
      source.map(
        q=>({...q})
      );

    shuffle(quizOrder);

    currentIndex=0;

    wrongQuestions=[];

    d.progress={
      mode,
      quizOrder,
      currentIndex,
      wrongQuestions
    };

    persist();

  }

  applyQuizBackground();

  showScreen("quizScreen");

  showQuestion();

}


/* =========================
   クイズ
========================= */

function applyQuizBackground(){

  const q=
    document.getElementById(
      "quizScreen"
    );

  const u=
    state.backgroundImage;

  q.style.backgroundImage=
    u
    ?`url("${u}")`
    :"none";

}

function shuffle(a){

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

}

function showQuestion(){

  clearTimers();

  const c=
    quizOrder[currentIndex];

  if(!c){

    showResult();

    return;

  }

  document.getElementById(
    "quizMeta"
  ).textContent=
    `${deck().name}｜${
      quizMode==="review"
      ?"復習デッキ"
      :"全問題デッキ"
    }｜問題番号：${c.number}`;


  document.getElementById(
    "quizNumber"
  ).textContent=
    `${currentIndex+1} / ${quizOrder.length} 問目`;


  const qb=
    document.getElementById(
      "questionBox"
    );

  const ab=
    document.getElementById(
      "answerBox"
    );


  qb.textContent="";

  ab.textContent=c.answer;

  ab.style.display="none";


  document.getElementById(
    "knowButton"
  ).style.display="inline-block";

  document.getElementById(
    "showAnswerButton"
  ).style.display="none";

  document.getElementById(
    "resultButtons"
  ).style.display="none";


  questionText=c.question;

  questionPosition=0;


  typingTimer=setInterval(()=>{

    if(
      questionPosition>=
      questionText.length
    ){

      clearInterval(
        typingTimer
      );

      typingTimer=null;

      return;

    }

    qb.textContent+=
      questionText.charAt(
        questionPosition++
      );

  },100);


  saveProgress();

}

function knowAnswer(){

  if(typingTimer!==null){

    clearInterval(
      typingTimer
    );

    typingTimer=null;

  }

  document.getElementById(
    "knowButton"
  ).style.display="none";

  document.getElementById(
    "showAnswerButton"
  ).style.display="inline-block";

  autoAnswerTimer=
    setTimeout(
      showAnswer,
      3000
    );

}

function showAnswer(){

  clearTimers();

  document.getElementById(
    "questionBox"
  ).textContent=
    quizOrder[currentIndex].question;

  document.getElementById(
    "answerBox"
  ).style.display="block";

  document.getElementById(
    "showAnswerButton"
  ).style.display="none";

  document.getElementById(
    "knowButton"
  ).style.display="none";

  document.getElementById(
    "resultButtons"
  ).style.display="flex";

}

function markCorrect(){

  nextQuestion();

}

function markWrong(){

  wrongQuestions.push(
    quizOrder[currentIndex].number
  );

  nextQuestion();

}

function nextQuestion(){

  clearTimers();

  currentIndex++;

  if(
    currentIndex>=
    quizOrder.length
  ){

    saveProgress();

    showResult();

    return;

  }

  saveProgress();

  showQuestion();

}

function saveProgress(){

  const d=deck();

  if(!d)return;

  d.progress={
    mode:quizMode,
    quizOrder:
      quizOrder.map(
        q=>({...q})
      ),
    currentIndex,
    wrongQuestions:[
      ...wrongQuestions
    ]
  };

  persist();

}

function showResult(){

  const d=deck();

  if(d){
    d.progress=null;
  }

  persist();

  alert(
    wrongQuestions.length
    ?
    `終了！\n誤答した問題の番号：${wrongQuestions.join("、")}`
    :
    "終了！\n全問正解！"
  );

  showMainDeckAfterQuiz();

}

function leaveQuiz(){

  clearTimers();

  saveProgress();

  showMainDeckAfterQuiz();

}

function showMainDeckAfterQuiz(){

  showScreen("mainScreen");

  showMainTab("decks");

}

function goSearchFromQuiz(){

  clearTimers();

  saveProgress();

  showScreen("mainScreen");

  showMainTab("search");

}

function backToDecks(){

  showScreen("mainScreen");

  showMainTab("decks");

}


/* =========================
   検索
========================= */

function renderSearch(){

  const q=
    (
      document.getElementById(
        "searchInput"
      ).value||""
    )
    .trim()
    .toLowerCase();

  const out=[];


  Object.values(
    state.decks
  ).forEach(d=>{

    d.questions.forEach(
      (x,i)=>{

        const hay=[
          d.name,
          x.number,
          x.question,
          x.answer
        ]
        .join("\n")
        .toLowerCase();


        if(
          !q||
          hay.includes(q)
        ){

          out.push({
            d,
            x,
            i
          });

        }

      }
    );

  });


  const el=
    document.getElementById(
      "searchResults"
    );


  el.innerHTML=
    out.length
    ?
    out.map(r=>`

      <div
        class="result-item"
        onclick="openSearchResult('${r.d.id}')">

        <span class="badge">
          ${esc(r.d.name)}
        </span>

        <b>
          問題番号：${esc(r.x.number)}
        </b>

        <div style="margin-top:5px">
          ${esc(r.x.question)}
        </div>

        <div class="muted">
          答え：${esc(r.x.answer)}
        </div>

      </div>

    `).join("")

    :

    '<div class="empty">該当する問題はありません。</div>';

}

function openSearchResult(id){

  openEditor(id);

}
